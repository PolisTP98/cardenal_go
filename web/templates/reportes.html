{% extends 'base.html' %}
{% block content %}
<h2>Gestión de reportes</h2>
<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>ID</th>
            <th>Reportador</th>
            <th>Reportado</th>
            <th>Viaje</th>
            <th>Fecha</th>
        </tr>
    </thead>
    <tbody>
        {% for r in reportes %}
        <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.id_reportador }}</td>
            <td>{{ r.id_reportado }}</td>
            <td>{{ r.id_viaje }}</td>
            <td>{{ r.fecha_hora_registro }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
