global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80

    acl is_well_known path_beg /.well-known/acme-challenge/

    http-request redirect scheme https code 301 if !is_well_known
    use_backend certbot_back if is_well_known

frontend https_front
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/server.pem

    acl path_api     path_beg /api
    acl path_ai      path_beg /ai
    acl path_grafana path_beg /grafana
    acl path_pgadmin path_beg /pgadmin

    use_backend api_back     if path_api
    use_backend ai_back      if path_ai
    use_backend grafana_back if path_grafana
    use_backend pgadmin_back if path_pgadmin

    default_backend flask_back

frontend api_internal_front
    bind *:8080
    mode http
    default_backend api_back

backend flask_back
    balance roundrobin
    cookie SERVERID insert indirect nocache
    option httpchk GET /
    http-check expect rstatus (2|3)[0-9][0-9]
    server flask1 cardenal_go_web_1:5000 check cookie web1
    server flask2 cardenal_go_web_2:5000 check cookie web2
    server flask3 cardenal_go_web_3:5000 check cookie web3

backend api_back
    balance roundrobin
    http-request replace-path ^/api/?(.*) /\1
    option httpchk GET /
    http-check expect status 200
    server api1 cardenal_go_backend:8000 check

backend ai_back
    http-request replace-path ^/ai/?(.*) /\1
    server ai1 cardenal_go_ridesharing_ai:8001 check

backend grafana_back
    balance roundrobin
    server grafana grafana-lab:3000 check

backend pgadmin_back
    http-request set-header Host %[{req.hdr(Host)}]
    http-request set-header X-Script-Name /pgadmin
    server pgadmin cardenal_go_pgadmin:80 check

backend certbot_back
    server certbot cardenal_go_certbot:80 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

frontend prometheus_front
    bind *:8405
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404
